<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残高照会｜日本みらいネット銀行</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #e5e7eb; /* PCで見た時の背景色 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* スマホアプリの枠をシミュレート */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* PC等で見たときにスマホっぽく角丸にする */
        @media (min-width: 480px) {
            .app-container {
                height: 800px;
                border-radius: 30px;
                border: 8px solid #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                overflow: hidden;
            }
        }

        /* 銀行のブランドカラー */
        .brand-color {
            color: #0ea5e9; /* Tailwindのsky-500 */
        }
        .bg-brand {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ヘッダー -->
        <header class="bg-brand text-white p-4 shadow-md flex justify-between items-center z-10">
            <div class="font-bold text-lg tracking-wider">日本みらいネット銀行</div>
            <a href="index.html" class="text-sm text-white underline underline-offset-4">画面選択へ戻る</a>
        </header>

        <!-- メインコンテンツ（スクロール可能） -->
        <main class="flex-grow overflow-y-auto pb-20">
            
            <div class="bg-white p-5 shadow-sm mb-2">
                <!-- 改ざんターゲット1: ユーザー名 -->
                <p class="text-gray-800 font-bold text-lg mb-1" id="account-name">山田 太郎 様</p>
                <div class="flex items-center text-sm text-gray-500 gap-2">
                    <span class="bg-gray-100 px-2 py-1 rounded text-xs">普通</span>
                    <span>本店営業部</span>
                    <span>1234567</span>
                </div>
            </div>

            <div class="bg-white p-6 shadow-sm mb-4 text-center border-t-4 border-sky-500">
                <p class="text-gray-500 text-sm mb-2">普通預金残高</p>
                <div class="flex justify-center items-baseline gap-1">
                    <span class="text-2xl font-bold text-gray-700">¥</span>
                    <!-- 改ざんターゲット2: 残高 -->
                    <span class="text-5xl font-bold text-gray-800 tracking-tight" id="total-balance">1,234,567</span>
                </div>
                <p class="text-xs text-gray-400 mt-3">現在日時: 2026/10/09 15:30</p>
            </div>

            <div class="bg-white shadow-sm">
                <div class="flex justify-between items-center p-4 border-b border-gray-100">
                    <h2 class="font-bold text-gray-700">最近の入出金明細</h2>
                    <a href="#" class="text-sky-500 text-sm">すべて見る</a>
                </div>

                <div class="flex flex-col">
                    
                    <!-- 明細項目1 -->
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center hover:bg-gray-50">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">10/25</p>
                            <!-- 改ざんターゲット3: 明細の項目名 -->
                            <p class="font-medium text-gray-800">給与振込（カブシキガイシヤ...）</p>
                        </div>
                        <div class="text-right">
                            <!-- 改ざんターゲット4: 明細の金額（プラス） -->
                            <p class="font-bold text-brand-color">+ 350,000</p>
                            <p class="text-xs text-gray-400">残高 1,234,567</p>
                        </div>
                    </div>

                    <!-- 明細項目2 -->
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center hover:bg-gray-50">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">10/23</p>
                            <p class="font-medium text-gray-800">ミライクレジットカード</p>
                        </div>
                        <div class="text-right">
                            <!-- 改ざんターゲット5: 明細の金額（マイナス） -->
                            <p class="font-bold text-red-500">- 54,320</p>
                            <p class="text-xs text-gray-400">残高 884,567</p>
                        </div>
                    </div>

                    <!-- 明細項目3 -->
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center hover:bg-gray-50">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">10/20</p>
                            <p class="font-medium text-gray-800">コンビニATM引出</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-red-500">- 10,000</p>
                            <p class="text-xs text-gray-400">残高 938,887</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-around py-3 pb-safe z-10">
            <div class="flex flex-col items-center text-sky-500">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-bold">ホーム</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                <span class="text-[10px]">振込・振替</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="text-[10px]">明細</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px]">設定</span>
            </div>
        </nav>

    </div>

</body>
</html>
