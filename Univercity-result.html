<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入学試験合否照会システム｜京東大学</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- リアルさを出すためにGoogle Fontsからゴシック体と明朝体を読み込みます -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6; /* PC閲覧時などのための薄いグレー背景 */
        }
        
        /* 合格の文字用の明朝体クラス */
        .font-mincho {
            font-family: 'Noto Serif JP', serif;
        }

        /* 独自カラーの定義 */
        .color-primary { color: #003366; } /* 京東大学のテーマカラー（紺色） */
        .bg-primary { background-color: #003366; }
        
        .bg-table-head { background-color: #e0f7fa; } /* テーブル左列の薄い水色 */
        .text-table-head { color: #00838f; } /* テーブル左列の文字色（青緑系） */
        
        .text-result-pass { color: #d32f2f; } /* 合格の赤色 */

        /* カスタムのドット区切り線 */
        .custom-dotted-line {
            border: none;
            border-top: 4px dotted #cbd5e1; /* Tailwindのgray-300相当 */
            color: #fff;
            background-color: #fff;
            height: 1px;
            width: 100%;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ヘッダー部分 -->
    <header class="bg-primary text-white py-4 px-4 shadow-md sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex items-center justify-center">
            <h1 class="text-lg sm:text-xl font-bold tracking-wider">京東大学 入学試験合否発表</h1>
        </div>
    </header>

    <!-- メインコンテンツ部分 -->
    <main class="flex-grow w-full max-w-3xl mx-auto bg-white shadow-sm sm:my-6 sm:rounded-lg overflow-hidden">
        <div class="p-5 sm:p-10 pt-8 sm:pt-12">
            
            <!-- 受験者名 -->
            <div class="mb-6 flex items-center">
                <!-- 左側のグレーの装飾線 -->
                <div class="w-1.5 h-6 bg-gray-200 rounded-full mr-3"></div>
                <!-- 改ざんターゲット1: 名前 -->
                <p class="text-lg sm:text-xl font-bold text-gray-800" id="applicant-name">佐藤 太郎 様</p>
            </div>

            <!-- 志願情報テーブル -->
            <table class="w-full border-collapse border border-gray-300 mb-12 text-sm sm:text-base">
                <tbody>
                    <tr class="border-b border-gray-300">
                        <th class="bg-table-head text-table-head p-3 text-left w-1/4 sm:w-1/5 font-medium border-r border-gray-300">志願先</th>
                        <!-- 改ざんターゲット2: 学部名 -->
                        <td class="p-3 text-gray-800" id="faculty-name">文科二類教養学部</td>
                    </tr>
                    <tr>
                        <th class="bg-table-head text-table-head p-3 text-left w-1/4 sm:w-1/5 font-medium border-r border-gray-300">試験</th>
                        <td class="p-3 text-gray-800">一般選抜（前期日程）</td>
                    </tr>
                </tbody>
            </table>

            <!-- 合否結果表示エリア -->
            <div class="text-center mb-8 mt-16">
                <!-- 改ざんターゲット3: 合格/不合格の文字と色 -->
                <h2 class="text-6xl sm:text-7xl font-mincho text-result-pass font-bold tracking-widest" id="result-text">合格</h2>
            </div>

            <!-- 案内文 -->
            <p class="text-gray-700 text-sm sm:text-base leading-relaxed mb-12 text-left sm:text-center px-2">
                「入学手続要領」と「合格通知書」の内容をよく読み、必ず期限内に入学手続を行ってください。
            </p>

            <!-- 区切り線（ドット） -->
            <div class="px-4 my-8">
                <hr class="custom-dotted-line">
            </div>

            <!-- 戻るボタン -->
            <div class="flex justify-center mt-12 mb-8">
                <button onclick="alert('実際のシステムでは前の画面に戻ります。')" class="bg-white border-2 border-gray-300 text-gray-600 rounded-full px-16 py-3 font-medium hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-4 focus:ring-gray-100 transition duration-200 shadow-sm">
                    戻 る
                </button>
            </div>

        </div>
    </main>

    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 mt-auto">
        &copy; KyotoTokyo University. All Rights Reserved.
    </footer>

</body>
</html>
