<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セキュリティシミュレーター｜画面選択</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 20px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
        }

        main {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        .page-heading {
            margin-bottom: 32px;
            text-align: center;
        }

        .page-heading h1 {
            margin: 0 0 10px;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
        }

        .page-heading p {
            margin: 0;
            color: #64748b;
        }

        .page-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 18px;
        }

        .page-card {
            display: block;
            padding: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            color: inherit;
            text-decoration: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        .page-card:hover,
        .page-card:focus-visible {
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
            transform: translateY(-2px);
        }

        .page-card:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .page-card h2 {
            margin: 0 0 8px;
            color: #1d4ed8;
            font-size: 1.15rem;
        }

        .page-card p {
            margin: 0;
            color: #64748b;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main>
        <header class="page-heading">
            <h1>セキュリティシミュレーター</h1>
            <p>表示する画面を選択してください。</p>
        </header>

        <nav class="page-list" aria-label="シミュレーター画面一覧">
            <a class="page-card" href="simulator.html">
                <h2>総合セキュリティ・シミュレーター</h2>
                <p>ブルートフォース、SQLインジェクション、XSSのシナリオを体験できます。</p>
            </a>
            <a class="page-card" href="pro.html">
                <h2>ブルートフォース特化版</h2>
                <p>複数のパスワード攻撃手法をシミュレーションできます。</p>
            </a>
            <a class="page-card" href="ginkou.html">
                <h2>銀行の残高照会画面</h2>
                <p>銀行アプリ風の残高・入出金明細画面です。</p>
            </a>
            <a class="page-card" href="Univercity-result.html">
                <h2>大学の合否照会画面</h2>
                <p>入学試験の合否発表を表示する画面です。</p>
            </a>
        </nav>
    </main>
</body>
</html>
